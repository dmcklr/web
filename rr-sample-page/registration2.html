<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration 2</title>
    <link rel="preload" as="script" href="https://cdn.tailwindcss.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">

<div class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="registration-container"></div>
</div>

<script src="app.js"></script>
<script src="header.js"></script>
<script>
loadApiData((setupData, error) => {
    if (error) {
        document.getElementById('registration-container').innerHTML = `<p>${error}</p>`;
        return;
    }
    renderRegistrationWidget(setupData, 'Registration2', 'registration-container');
});
</script>
</body>
</html>
