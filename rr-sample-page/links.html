<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links - Presenter & Kiosks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">

<div class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="links-content">
        <h1 class="text-4xl font-bold text-slate-800 mb-8">Links</h1>
        <div id="presenters-section" class="mb-8"></div>
        <div id="kiosks-section"></div>
    </div>
</div>

<script src="app.js"></script>
<script src="header.js"></script>
<script>
loadApiData((setupData, error) => {
    const contentDiv = document.getElementById('links-content');
    
    if (error) {
        contentDiv.innerHTML = `<h1 class="text-4xl font-bold text-slate-800 mb-8">Links</h1><p class="text-slate-600">${error}</p>`;
        return;
    }
    
    const presentersContainer = document.getElementById('presenters-section');
    const kiosksContainer = document.getElementById('kiosks-section');

    // Presenter Links anzeigen
    const presenters = [];
    Object.keys(setupData).forEach(key => {
        if (key.startsWith('Presenter') && setupData[key]) {
            presenters.push({ key, url: setupData[key] });
        }
    });

    if (presenters.length > 0) {
        const h2 = document.createElement('h2');
        h2.textContent = 'Presenters';
        h2.className = 'text-2xl font-bold text-slate-700 mb-4';
        presentersContainer.appendChild(h2);
        
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4';
        
        presenters.forEach(item => {
            const card = document.createElement('a');
            card.href = item.url;
            card.target = '_blank';
            card.className = 'group bg-white rounded-xl shadow-md hover:shadow-xl transition-all duration-300 p-6 border border-slate-200 hover:border-blue-400 hover:-translate-y-1';
            
            // Card Content
            const cardContent = document.createElement('div');
            cardContent.className = 'flex items-center justify-between';
            
            // Title
            const title = document.createElement('h3');
            title.textContent = item.key;
            title.className = 'text-lg font-semibold text-slate-800 group-hover:text-blue-600 transition-colors';
            
            // External Link Icon (using SVG)
            const icon = document.createElement('div');
            icon.innerHTML = `<svg class="w-5 h-5 text-slate-400 group-hover:text-blue-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
            </svg>`;
            
            cardContent.appendChild(title);
            cardContent.appendChild(icon);
            card.appendChild(cardContent);
            
            grid.appendChild(card);
        });
        
        presentersContainer.appendChild(grid);
    }

    // Kiosk Links anzeigen
    const kiosks = [];
    Object.keys(setupData).forEach(key => {
        if (key.startsWith('Kiosk') && setupData[key]) {
            kiosks.push({ key, url: setupData[key] });
        }
    });

    if (kiosks.length > 0) {
        const h2 = document.createElement('h2');
        h2.textContent = 'Kiosks';
        h2.className = 'text-2xl font-bold text-slate-700 mb-4';
        kiosksContainer.appendChild(h2);
        
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4';
        
        kiosks.forEach(item => {
            const card = document.createElement('a');
            card.href = item.url;
            card.target = '_blank';
            card.className = 'group bg-white rounded-xl shadow-md hover:shadow-xl transition-all duration-300 p-6 border border-slate-200 hover:border-purple-400 hover:-translate-y-1';
            
            // Card Content
            const cardContent = document.createElement('div');
            cardContent.className = 'flex items-center justify-between';
            
            // Title
            const title = document.createElement('h3');
            title.textContent = item.key;
            title.className = 'text-lg font-semibold text-slate-800 group-hover:text-purple-600 transition-colors';
            
            // External Link Icon (using SVG)
            const icon = document.createElement('div');
            icon.innerHTML = `<svg class="w-5 h-5 text-slate-400 group-hover:text-purple-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
            </svg>`;
            
            cardContent.appendChild(title);
            cardContent.appendChild(icon);
            card.appendChild(cardContent);
            
            grid.appendChild(card);
        });
        
        kiosksContainer.appendChild(grid);
    }

    // Wenn keine Links vorhanden
    if (presenters.length === 0 && kiosks.length === 0) {
        contentDiv.innerHTML = '<h1 class="text-4xl font-bold text-slate-800 mb-8">Links</h1><p class="text-slate-600">No Presenter or Kiosk links available for this user.</p>';
    }
});
</script>

</body>
</html>
