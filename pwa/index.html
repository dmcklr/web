<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>RACE RESULT Player</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e5e7eb;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #efefef;
    }

    header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 500;
      color: #e5e7eb;
    }

    #toggleMenuBtn {
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      border: 0;
      background: #efefef;
      cursor: pointer;
      font-size: 0.875rem;
      display: inline-flex;
      align-items: center;
      color: #808080;
      gap: 0.35rem;
    }

    #toggleMenuBtn:focus-visible {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
    }

    #toggleMenuBtn span.icon {
      font-size: 1rem;
    }

    .video-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    #playerContainer {
      width: 100%;
      max-width: 1200px;
      border-radius: 0.75rem;  
      overflow: hidden;
      margin-top: -5rem;
    }

    .embed-wrapper {
      position: relative;
      padding: 56.25% 0 0 0;
    }

    .embed-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Overlay hinter dem Menü */
    #backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-out;
      z-index: 40;
    }

    #backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Seitenmenü */
    #videoMenu {
      position: fixed;
      inset-block: 0;
      left: 0;
      width: 100%;
      max-width: 500px;
      background: #fff;
      transform: translateX(-100%);
      transition: transform 0.22s ease-out;
      z-index: 50;
      display: flex;
      flex-direction: column;
    }

    #videoMenu.open {
      transform: translateX(0);
    }

    .menu-header {
      padding: 0.75rem 0 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .menu-header h2 {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 500;
      color: #2c2c2c;
    }

    #closeMenuBtn {
      border: none;
      background: transparent;
      color: #c41011;
      cursor: pointer;
      font-size: 2rem;
      padding: 0 2rem;
      border-radius: 1rem;
    }

    #closeMenuBtn:hover {
      background: #efefef;
      color: #2c2c2c;
    }

    .menu-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0.5rem 0.75rem;
    }

    .video-item {
      display: flex;
      border: 0;
      margin: 1rem 0;
      width: 100%;
      gap: 0.6rem;
      padding: 0.45rem;
      border-radius: 0.6rem;
      cursor: pointer;
      align-items: center;
      transition: background 0.12s ease-out, transform 0.12s ease-out;
      background-color: #ddd;
    }

    .video-item:hover {
      background: #B2B2B2;
      transform: translateY(-1px);
    }

    .video-item.active {
      background: #CCD9F5;
      border: 1px solid #12214D;
    }

    .thumb {
      flex-shrink: 0;
      width: 180px;
      max-width: 50%;
      aspect-ratio: 16 / 9;
      border-radius: 0.5rem;
      overflow: hidden;
      background: #020617;
      border: 1px solid #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #9ca3af;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .video-title {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #2c2c2c;
    }

    .video-sub {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 0.15rem;
      display: none;
    }

    @media (max-width: 640px) {
      header {
        padding-inline: 0.75rem;
      }

      .video-wrapper {
        padding: 0.75rem;
      }

      #playerContainer {
        max-height: 55vh;
      }
    }
  </style>
</head>
<body>
  <div id="backdrop"></div>

  <aside id="videoMenu" aria-label="Videoliste">
    <div class="menu-header">
      <button id="closeMenuBtn" aria-label="Menü schließen">&times;</button>
    </div>
    <div id="videoList" class="menu-list" role="list"></div>
  </aside>

  <main>
    <header>
      <img src="https://images.raceresult.com/website/logo-red.svg" alt="" style="height:2rem;">
      <button id="toggleMenuBtn" type="button" aria-haspopup="true" aria-expanded="false">
        <span>All Videos</span>
      </button>
    </header>

    <section class="video-wrapper">
      <div id="playerContainer">
        <div class="embed-wrapper">
          <iframe
            id="vimeoPlayer"
            src=""
            frameborder="0"
            allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            title="Video"
          ></iframe>
        </div>
      </div>
    </section>
  </main>

  <script> 
    const videos = [
      {
        id: "berlin",
        title: "Berlin Marathon",
        vimeoId: "1139265850",
        thumbnail: "thumbs/berlin.jpg"
      },
      {
        id: "ubidium",
        title: "Ubidium",
        vimeoId: "1139268572",
        thumbnail: "thumbs/ubidium.jpg"
      },
      {
        id: "trackboxpassive",
        title: "Track Box Passive",
        vimeoId: "1139267912",
        thumbnail: "thumbs/trackboxpassive.jpg"
      },
      {
        id: "hardwareproduction",
        title: "Hardware Production",
        vimeoId: "1139267779",
        thumbnail: "thumbs/hardwareproduction.jpg"
      },
      {
        id: "printing",
        title: "Bib Printing",
        vimeoId: "1139267656",
        thumbnail: "thumbs/printing.jpg"
      },
      {
        id: "chipping",
        title: "Bib Chipping",
        vimeoId: "1139267707",
        thumbnail: "thumbs/chipping.jpg"
      },
      {
        id: "printmonster",
        title: "Chip Printing",
        vimeoId: "1139267863",
        thumbnail: "thumbs/printmonster.jpg"
      }
    ];

    const VIMEO_PARAMS_AUTO = "?title=0&byline=0&portrait=0&badge=0&autopause=0&muted=1&autoplay=1&app_id=58479";

    const VIMEO_PARAMS_NO_AUTO = "?title=0&byline=0&portrait=0&badge=0&autopause=0&muted=1&app_id=58479";

    const vimeoPlayer = document.getElementById("vimeoPlayer");
    const videoMenu = document.getElementById("videoMenu");
    const videoList = document.getElementById("videoList");
    const toggleMenuBtn = document.getElementById("toggleMenuBtn");
    const closeMenuBtn = document.getElementById("closeMenuBtn");
    const backdrop = document.getElementById("backdrop");

    let currentVideoId = null;
    let menuScrollPos = 0;

    function buildMenu() {
      videoList.innerHTML = "";

      videos.forEach((video) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "video-item";
        item.setAttribute("data-video-id", video.id);
        item.setAttribute("role", "listitem");

        const thumbWrapper = document.createElement("div");
        thumbWrapper.className = "thumb";

        if (video.thumbnail) {
          const img = document.createElement("img");
          img.src = video.thumbnail;
          img.alt = `Vorschau von ${video.title}`;
          thumbWrapper.appendChild(img);
        } else {
          thumbWrapper.textContent = "Preview";
        }

        const meta = document.createElement("div");
        meta.className = "video-meta";

        const title = document.createElement("div");
        title.className = "video-title";
        title.textContent = video.title;

        const sub = document.createElement("div");
        sub.className = "video-sub";
        sub.textContent = `Vimeo ID: ${video.vimeoId}`;

        meta.appendChild(title);
        meta.appendChild(sub);

        item.appendChild(thumbWrapper);
        item.appendChild(meta);

        item.addEventListener("click", () => {
          loadVideo(video.id, true); // autoplay aktiv
          closeMenu();
        });

        videoList.appendChild(item);
      });
    }

    function loadVideo(videoId, autoplay = false) {
      const videoData = videos.find(v => v.id === videoId);
      if (!videoData) return;

      const params = autoplay ? VIMEO_PARAMS_AUTO : VIMEO_PARAMS_NO_AUTO;
      const newSrc = `https://player.vimeo.com/video/${videoData.vimeoId}${params}`;

      vimeoPlayer.src = newSrc;

      currentVideoId = videoId;
      markActiveItem(videoId);
    }


    function markActiveItem(videoId) {
      const items = videoList.querySelectorAll(".video-item");
      items.forEach(item => {
        const id = item.getAttribute("data-video-id");
        if (id === videoId) {
          item.classList.add("active");
        } else {
          item.classList.remove("active");
        }
      });
    }

    function openMenu() {
      videoMenu.classList.add("open");
      backdrop.classList.add("active");
      toggleMenuBtn.setAttribute("aria-expanded", "true");
      videoList.scrollTop = menuScrollPos;
    }

    function closeMenu() {
      menuScrollPos = videoList.scrollTop;
      videoMenu.classList.remove("open");
      backdrop.classList.remove("active");
      toggleMenuBtn.setAttribute("aria-expanded", "false");
    }

    toggleMenuBtn.addEventListener("click", () => {
      if (videoMenu.classList.contains("open")) {
        closeMenu();
      } else {
        openMenu();
      }
    });

    closeMenuBtn.addEventListener("click", () => {
      closeMenu();
    });

    backdrop.addEventListener("click", () => {
      closeMenu();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && videoMenu.classList.contains("open")) {
        closeMenu();
      }
    });

    // Initialisierung
    buildMenu();

    // Erstes Video laden
    if (videos.length > 0) {
      loadVideo(videos[0].id, false);
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker
        .register('./sw.js')
        .catch(console.error);
    }
  </script>

  <!-- Nur nötig, wenn du später die Vimeo Player API verwenden willst -->
  <script src="https://player.vimeo.com/api/player.js"></script>
</body>
</html>
