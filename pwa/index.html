<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>PWA YouTube App</title>

  <link rel="manifest" href="manifest.json" />

  <style>
    body {
      margin: 0;
      background: #ffffff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 800px;
      padding: 16px;
      box-sizing: border-box;
    }
    iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>RR Video App</h1>
    <p>This app is designed to have several videos in a sidebar, which you can select and view.</p>
    <p>We will check if we can emed with vimeo or with online hosted mp4 files.</p>
  
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register("./sw.js")
        .catch(console.error);
    }
  </script>
</body>
</html>
