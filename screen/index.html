<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Seite alle 300 Sekunden (5 Minuten) neu laden -->
    <meta http-equiv="refresh" content="300">
    <link rel="stylesheet" href="https://use.typekit.net/kng6cpn.css?v=v1.2.69">
    <link rel="stylesheet" href="styles1.css">
</head>
<body>
    <div class="screen">
        <img src="red-bg.png" class="red-bg" alt="">
        <div class="pics">
            <img src="images/berlin.jpg" alt="" class="active">
            <img src="images/ironman.jpg" alt="">
            <img src="images/erzberg.jpg" alt="">
            <img src="images/spartan.jpg" alt="">
            <img src="images/berlin2.jpg" alt="">
            <img src="images/mtb.jpg" alt="">
            <img src="images/deka.jpg" alt="">
            <img src="images/trail.jpg" alt="">
        </div>


        <header class="header">
            <div class="welcome">
                <h1>Welcome</h1>
                <h2>Distributors Meeting 2025</h2>
            </div>
            <div class="logo">
                <!-- Optional: Hier könnte ein <img> statt Text hin -->
                <img src="https://images.raceresult.com/website/logo-white.png" alt="">
            </div>
            
        </header>

        <main class="main-content">            
        </main>

        <footer class="footer">          
        </footer>
    </div>
</body>

<script>
    const intervalTime = 5000;
const pics = document.querySelectorAll('.pics img');
let index = 0;

setInterval(() => {
    pics[index].classList.remove('active');        // aktuelle entfernen
    index = (index + 1) % pics.length;             // nächste, mit Rücksprung
    pics[index].classList.add('active');           // neue setzen
}, intervalTime);
</script>
</html>
