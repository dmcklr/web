<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turngeräte Videos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .video-section {
      margin: 20px 0;
      width: 100%;
      max-width: 680px;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    .video-section h2 {
      display: flex;
      align-items: center;
      font-size: 1.5rem;
    }
    .video-section h2 i {
      font-size: 1.5rem;
      margin-right: 10px;
    }
    video {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>💪 Videos für David ✌️</h1>

  <div class="video-section">
    <h2><i class="fas fa-circle"></i> Boden P2</h2>
    <video controls>
      <source src="videos/boden-p2.mp4" type="video/mp4">
      
    </video>
  </div>

  <div class="video-section">
    <h2><i class="fas fa-align-justify"></i>Barren P3</h2>
    <video controls>
      <source src="videos/barren-p3.mp4" type="video/mp4">
     
    </video>
  </div>

  <div class="video-section">
    <h2><i class="fas fa-grip-lines"></i>Reck P3</h2>
    <video controls>
      <source src="videos/reck-p3.mp4" type="video/mp4">
     
    </video>
  </div>

  <div class="video-section">
    <h2><i class="fas fa-archway"></i>Sprung P3</h2>
    <video controls>
      <source src="videos/sprung-p3.mp4" type="video/mp4">
      
    </video>
  </div>

</body>
</html>
